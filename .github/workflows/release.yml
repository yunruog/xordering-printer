# Pushing a version tag (v0.1.0, …) builds XOrderingPrinter.exe on Windows and publishes it to
# GitHub Releases with its SHA-256; installed copies update themselves from there within a day.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the program's version
        shell: bash
        run: |
          v=$(python -c "import xordering_printer as x; print(x.VERSION)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but VERSION is $v"; exit 1; }
      - run: pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build one exe (no console window, nothing to install)
        run: pyinstaller --noconfirm --onefile --windowed --name XOrderingPrinter --collect-submodules xordering_printer --add-data "xordering_printer/fonts:xordering_printer/fonts" XOrderingPrinter.py
      - name: Smoke test the exe (the worker starts and writes its status)
        shell: pwsh
        run: |
          $env:XORDERING_PRINTER_HOME = Join-Path $env:RUNNER_TEMP "xop-smoke"
          $env:XORDERING_PRINTER_PORT = "47391"
          $p = Start-Process -FilePath dist\XOrderingPrinter.exe -ArgumentList "--worker" -PassThru
          Start-Sleep -Seconds 20
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $status = Get-Content (Join-Path $env:XORDERING_PRINTER_HOME "status.json") | ConvertFrom-Json
          if ($status.state -ne "setup") { throw "unexpected state $($status.state)" }
      - name: Smoke test the bundled font (the ticket picture draws Chinese with it)
        shell: pwsh
        run: |
          $env:XORDERING_PRINTER_HOME = Join-Path $env:RUNNER_TEMP "xop-font"
          $p = Start-Process -FilePath dist\XOrderingPrinter.exe -ArgumentList "--self-check" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-check failed ($($p.ExitCode))" }
          Get-Content (Join-Path $env:XORDERING_PRINTER_HOME "self-check.json")
          "status: version $($status.version), state $($status.state)"
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\XOrderingPrinter.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\XOrderingPrinter.exe.sha256 -Value "$h  XOrderingPrinter.exe" -NoNewline -Encoding ascii
          Get-Content dist\XOrderingPrinter.exe.sha256
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/XOrderingPrinter.exe dist/XOrderingPrinter.exe.sha256 \
            --title "XOrdering Printer $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --latest
